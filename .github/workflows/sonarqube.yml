name: SonarQube Cloud

# Code quality and security analysis on SonarQube Cloud.
# Settings live in sonar-project.properties at the repository root.
# Needs the SONAR_TOKEN repository secret (Settings -> Secrets and variables
# -> Actions). Pull requests from forks cannot read it, so they are skipped.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_RUN_BIN_VERSION: 1.7.5
  CARGO_TERM_COLOR: always

jobs:
  analyze:
    name: Analyze
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history lets Sonar attribute issues to commits and detect new code.
          fetch-depth: 0
          persist-credentials: false

      # rustup reads src/rust-toolchain.toml and installs the pinned toolchain.
      - name: Install pinned Rust toolchain
        working-directory: src
        run: rustup show active-toolchain

      - name: Cache Cargo data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src/target/
          key: sonar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Cargo.lock', 'src/rust-toolchain.toml') }}
          restore-keys: sonar-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache project tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            src/.bin/
            ~/.cargo/bin/cargo-bin
          key: tools-${{ env.CARGO_RUN_BIN_VERSION }}-sonar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Cargo.toml', 'src/rust-toolchain.toml') }}

      # Sonar's Rust analysis imports Clippy findings from a JSON report.
      - name: Run Clippy for Sonar
        working-directory: src
        run: cargo clippy --workspace --all-targets --all-features --locked --message-format=json > clippy-report.json

      - name: Install cargo-llvm-cov
        working-directory: src
        run: |
          command -v cargo-bin || cargo install cargo-run-bin --version "${{ env.CARGO_RUN_BIN_VERSION }}" --locked
          cargo bin cargo-llvm-cov --version

      # LCOV coverage of the workspace tests, read by Sonar for the coverage gate.
      - name: Measure test coverage
        working-directory: src
        run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
