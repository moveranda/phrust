name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # The main-branch ruleset requires CodeQL results, and the merge queue
  # waits for them on its own merge-group commit.
  merge_group:
  schedule:
    # Weekly, so new CodeQL queries also run against unchanged code.
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Deny all permissions by default. Each job grants only what it needs.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # No build step is needed: every language here is analysed from source.
        #   rust                   the Cargo workspace in src/
        #   javascript-typescript  the docs site in docs/
        #   actions                the workflows in .github/workflows/
        language: [rust, javascript-typescript, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          category: /language:${{ matrix.language }}
