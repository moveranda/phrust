name: OpenSSF Scorecard

# Rates the repository's supply-chain security (pinned actions, token
# permissions, branch protection, signed releases, ...) and reports findings
# under Security -> Code scanning.
# https://github.com/ossf/scorecard-action
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Upload results to code scanning.
      security-events: write
      # Publish results to the public Scorecard API and enable the badge.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: results.sarif
