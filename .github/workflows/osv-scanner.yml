name: OSV Scanner

# Checks every lockfile in the repository (src/Cargo.lock,
# docs/pnpm-lock.yaml) against https://osv.dev and reports known
# vulnerabilities under Security -> Code scanning. Pull requests only fail on
# vulnerabilities they introduce.
# https://google.github.io/osv-scanner/github-action/
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Scan dependencies
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --recursive
        ./

  scan-pr:
    name: Scan dependency changes
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --recursive
        ./
