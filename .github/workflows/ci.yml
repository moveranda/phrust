name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Deny all permissions by default. Each job grants only what it needs.
permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_RUN_BIN_VERSION: 1.7.5
  CARGO_TERM_COLOR: always
  CI: 1
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10

jobs:
  quality:
    name: Format, lint, licences
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # rustup reads src/rust-toolchain.toml and installs the pinned toolchain.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src/target/
          key: quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Cargo.lock', 'src/rust-toolchain.toml') }}
          restore-keys: quality-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache project tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            src/.bin/
            ~/.cargo/bin/cargo-bin
          key: tools-${{ env.CARGO_RUN_BIN_VERSION }}-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Cargo.toml', 'src/rust-toolchain.toml') }}

      - name: Install project tools
        run: |
          command -v cargo-bin || cargo install cargo-run-bin --version "${{ env.CARGO_RUN_BIN_VERSION }}" --locked
          cargo bin cargo-deny --version
          cargo bin cargo-machete --version
          cargo bin typos-cli --version

      - name: Check spelling
        run: cargo typos ..

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (native)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Clippy (web)
        run: cargo clippy --workspace --all-features --locked --target wasm32-unknown-unknown -- -D warnings

      - name: Check documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check licences, advisories and sources
        run: cargo deny check

      - name: Check unused dependencies
        run: cargo machete

  build-and-test:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}

      - name: Cache Cargo data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src/target/
          key: build-${{ matrix.target }}-${{ hashFiles('src/Cargo.lock', 'src/rust-toolchain.toml') }}
          restore-keys: build-${{ matrix.target }}-

      - name: Cache project tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            src/.bin/
            ~/.cargo/bin/cargo-bin
          key: tools-${{ env.CARGO_RUN_BIN_VERSION }}-test-${{ matrix.target }}-${{ hashFiles('src/Cargo.toml', 'src/rust-toolchain.toml') }}

      - name: Install nextest
        run: |
          command -v cargo-bin || cargo install cargo-run-bin --version "${{ env.CARGO_RUN_BIN_VERSION }}" --locked
          cargo bin cargo-nextest --version

      - name: Build workspace
        run: cargo build --workspace --all-targets --locked --target ${{ matrix.target }}

      - name: Run tests
        run: cargo nextest run --workspace --all-targets --locked --target ${{ matrix.target }} --no-fail-fast

      - name: Run doc tests
        run: cargo test --workspace --doc --locked --target ${{ matrix.target }}

  packaging:
    name: Check Linux packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils appstream shellcheck

      - name: Check packaging script
        run: shellcheck --external-sources packaging/linux/package.sh

      - name: Validate desktop entry and metainfo
        run: |
          desktop-file-validate packaging/linux/*.desktop
          appstreamcli validate --no-net packaging/linux/*.metainfo.xml

  docs:
    name: Build documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

  mutations:
    name: Mutation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: mutations-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Cargo.lock', 'src/rust-toolchain.toml') }}
          restore-keys: mutations-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache project tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            src/.bin/
            ~/.cargo/bin/cargo-bin
          key: tools-${{ env.CARGO_RUN_BIN_VERSION }}-mutations-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Cargo.toml', 'src/rust-toolchain.toml') }}

      - name: Install mutation testing tool
        run: |
          command -v cargo-bin || cargo install cargo-run-bin --version "${{ env.CARGO_RUN_BIN_VERSION }}" --locked
          cargo mutants --version

      - name: Run mutation tests
        run: cargo mutants --workspace --timeout 60 -- --locked

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: src/mutants.out/
          if-no-files-found: warn
          retention-days: 14
