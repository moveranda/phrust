# SonarQube Cloud analysis settings, read by .github/workflows/sonarqube.yml.
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/
sonar.organization=moveranda
sonar.projectKey=moveranda_phrust
sonar.projectName=Phrust

# Engine crates and the documentation site.
sonar.sources=src/crates,docs/src
sonar.exclusions=**/target/**,**/node_modules/**,docs/src/assets/**

# Rust unit tests live next to the code; Sonar's Rust analyzer detects
# #[cfg(test)] modules on its own.

# Clippy findings, produced by the workflow before the scan.
sonar.rust.clippy.reportPaths=src/clippy-report.json
